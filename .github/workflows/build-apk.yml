name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: flutter_app
        run: flutter analyze

      - name: Run unit and widget tests
        working-directory: flutter_app
        run: flutter test --no-pub

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release --no-pub

      - name: Copy release APK
        run: cp flutter_app/build/app/outputs/flutter-apk/app-release.apk MyHealthTracker.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyHealthTracker-apk
          path: MyHealthTracker.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            git tag -f latest HEAD
            git push --force origin refs/tags/latest
            gh release upload latest MyHealthTracker.apk --clobber
            gh release edit latest \
              --title "My Health Tracker (Latest APK)" \
              --notes "Latest Android APK built from commit \`${{ github.sha }}\` (Actions run #${{ github.run_number }})."
          else
            gh release create latest MyHealthTracker.apk \
              --target "${{ github.sha }}" \
              --title "My Health Tracker (Latest APK)" \
              --notes "Latest Android APK built from commit \`${{ github.sha }}\` (Actions run #${{ github.run_number }})." \
              --latest
          fi

